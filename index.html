<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deva Rocca</title>
  <meta name="description" content="Deva Rocca, director. Showreel and selected works.">
  <meta name="theme-color" content="#0B0B0B">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Deva Rocca">
  <meta property="og:description" content="Director. Showreel and selected works.">
  <meta property="og:image" content="media/web/video/showreel-poster.jpg">
  <link rel="preload" as="image" href="media/web/video/showreel-poster.jpg" fetchpriority="high">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body class="home">
  <section class="hero" aria-label="Showreel">
    <!--
      Autoplay needs muted + playsinline + autoplay. The files are faststart
      H.264/AAC MP4s built by scripts/prepare-media.sh: 1080p on wide screens,
      720p on phones (and as the fallback). Sound is turned on with "Sound".
    -->
    <video
      class="hero__video"
      id="hero-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      disablepictureinpicture
      poster="media/web/video/showreel-poster.jpg">
      <source src="media/web/video/showreel-1080.mp4" type="video/mp4" media="(min-width: 1000px)">
      <source src="media/web/video/showreel-720.mp4" type="video/mp4">
    </video>
    <div class="hero__shade" aria-hidden="true"></div>

    <div class="hero__center">
      <h1 class="wordmark wordmark--xl">Deva Rocca</h1>
      <a class="button mono" href="works.html">Selected works</a>
    </div>

    <footer class="hero__footer mono">
      <div class="hero__links">
        <a href="https://www.instagram.com/hwdev/" target="_blank" rel="noopener">@hwdev</a>
        <a href="mailto:hello@deva.film">hello@deva.film</a>
      </div>
      <button class="hero__sound mono" id="sound-toggle" type="button" aria-pressed="false">Sound — off</button>
    </footer>
  </section>
</body>
</html>
