<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deva — Réalisatrice</title>
  <meta name="description" content="Deva, réalisatrice. Showreel 2026 et photographies.">
  <meta name="theme-color" content="#0B0B0B">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Deva — Réalisatrice">
  <meta property="og:description" content="Showreel 2026 et photographies.">
  <meta property="og:image" content="media/web/video/showreel-poster.jpg">

  <!-- Poster first, so the hero is never an empty black box while the reel buffers. -->
  <link rel="preload" as="image" href="media/web/video/showreel-poster.jpg" fetchpriority="high">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <!-- ───────────── Hero: showreel ───────────── -->
  <section class="hero" aria-label="Showreel 2026">
    <!--
      Autoplay needs muted + playsinline + autoplay. The files are faststart
      H.264/AAC MP4s built by scripts/prepare-media.sh, so they start playing
      while they download: 1080p on wide screens, 720p on phones (and as the
      fallback if the 1080p file is missing). Sound is turned on with "Son".
    -->
    <video
      class="hero__video"
      id="hero-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      disablepictureinpicture
      poster="media/web/video/showreel-poster.jpg">
      <source src="media/web/video/showreel-1080.mp4" type="video/mp4" media="(min-width: 1000px)">
      <source src="media/web/video/showreel-720.mp4" type="video/mp4">
    </video>

    <div class="hero__fade" aria-hidden="true"></div>

    <header class="hero__header">
      <div class="brand">
        <span class="wordmark">Deva</span>
        <span class="mono">Réalisatrice</span>
      </div>
      <nav class="mono nav" aria-label="Navigation">
        <a href="#photos">Photos</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <button class="mono hero__sound" id="sound-toggle" type="button" aria-pressed="false" hidden>Son — off</button>
    <span class="mono hero__label">Showreel 2026</span>
  </section>
