# Static site: no build step. Also works as-is on Vercel, Cloudflare Pages or GitHub Pages.
[build]
  publish = "."

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
