# Static site, no framework. The build step only copies what visitors need into
# dist/, so the original photos and video in media/source/ are never published.
[build]
  command = "bash scripts/build.sh"
  publish = "dist"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Accept-Ranges = "bytes"
